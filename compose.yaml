services:
  avalon:
    build:
      context: .
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    container_name: avalon-lan
    restart: unless-stopped
    environment:
      AVALON_ACCESS_PASSWORD: ${AVALON_ACCESS_PASSWORD:?Set AVALON_ACCESS_PASSWORD in .env}
      AVALON_DB_PATH: /data/avalon.sqlite3
    ports:
      - "${AVALON_PORT:-8800}:8000"
    volumes:
      - avalon-data:/data

volumes:
  avalon-data:
