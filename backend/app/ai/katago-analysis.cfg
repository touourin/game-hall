# Bounded CPU profile for two concurrent interactive board analyses.
logFile = /dev/null
logToStderr = false
logErrorsAndWarnings = true
reportAnalysisWinratesAs = BLACK
wideRootNoise = 0.0
conservativePass = true
preventCleanupPhase = true
maxVisits = 48
maxTime = 10
numAnalysisThreads = 2
numSearchThreadsPerAnalysisThread = 2
numEigenThreadsPerModel = 4
nnMaxBatchSize = 4
maxBoardXSizeForNNBuffer = 19
maxBoardYSizeForNNBuffer = 19
nnCacheSizePowerOfTwo = 16
nnMutexPoolSizePowerOfTwo = 12
nnRandomize = true
